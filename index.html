<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLE & Orbital Decay Analyzer</title>
    <!-- โหลด Tailwind CSS สำหรับแต่งหน้าเว็บให้สวยงามทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดไลบรารี satellite.js สำหรับคำนวณวงโคจร SGP4 บนบราวเซอร์ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- หัวข้อแอป -->
        <header class="text-center">
            <h1 class="text-2xl font-bold text-blue-400">🛰️ TLE Decay & Semi-Major Axis Analyzer</h1>
            <p class="text-sm text-gray-400 mt-1">วิเคราะห์การลดระดับวงโคจรวัตถุอวกาศจากชุดข้อมูล TLE</p>
        </header>

        <!-- ฟอร์มกรอกข้อมูล TLE -->
        <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 shadow-lg space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">TLE Line 1:</label>
                <input type="text" id="tle1" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 font-mono focus:ring-2 focus:ring-blue-500 outline-none" placeholder="1 43802U 18102A   26172.50419074...">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">TLE Line 2:</label>
                <input type="text" id="tle2" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 font-mono focus:ring-2 focus:ring-blue-500 outline-none" placeholder="2 43802  97.4123 123.4567 0012345...">
            </div>
            <button onclick="analyzeTLE()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition text-sm shadow">
                วิเคราะห์ข้อมูล (Analyze)
            </button>
        </div>

        <!-- ส่วนแสดงผลลัพธ์ -->
        <div id="resultBox" class="bg-gray-900 p-5 rounded-xl border border-gray-800 shadow-lg hidden space-y-3">
            <h2 class="text-lg font-semibold text-green-400 border-b border-gray-800 pb-2">📊 ผลการวิเคราะห์</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="bg-gray-950 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 block text-xs">Semi-major Axis ($a$)</span>
                    <span id="resSma" class="text-xl font-bold text-blue-300 font-mono">-</span> กม.
                </div>
                <div class="bg-gray-950 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 block text-xs">Mean Motion</span>
                    <span id="resMeanMotion" class="text-xl font-bold text-purple-300 font-mono">-</span> รอบ/วัน
                </div>
            </div>
            <div id="statusMessage" class="p-3 rounded-lg text-sm font-medium mt-2"></div>
        </div>

    </div>

    <!-- ส่วนประมวลผล JavaScript -->
    <script>
        const MU = 3.986004418e14; // ค่าคงที่แรงโน้มถ่วงโลก (m^3/s^2)

        function analyzeTLE() {
            const line1 = document.getElementById('tle1').value.trim();
            const line2 = document.getElementById('tle2').value.trim();

            if (!line1 || !line2) {
                alert("กรุณากรอกข้อมูล TLE ทั้ง 2 บรรทัดครับ");
                return;
            }

            try {
                // สร้าง Satrec object จาก satellite.js
                const satrec = satellite.twoline2satrec(line1, line2);
                
                // sat.no คือ Mean Motion ในหน่วยเรเดียนต่อนาที
                const meanMotionRadMin = satrec.no;
                const revPerDay = meanMotionRadMin * 1440.0 / (2.0 * Math.PI);

                // คำนวณ Semi-major axis ตามกฎข้อที่ 3 ของเคปเลอร์
                const nRadS = meanMotionRadMin / 60.0;
                const smaMeters = Math.pow(MU / Math.pow(nRadS, 2), 1.0 / 3.0);
                const smaKm = smaMeters / 1000.0;

                // แสดงผลลัพธ์ลงบนหน้าเว็บ
                document.getElementById('resSma').innerText = smaKm.toFixed(3);
                document.getElementById('resMeanMotion').innerText = revPerDay.toFixed(4);

                // ประเมินสถานะเบื้องต้น
                const statusBox = document.getElementById('statusMessage');
                if (revPerDay > 15.0) {
                    statusBox.className = "p-3 rounded-lg text-sm font-medium bg-red-950 text-red-300 border border-red-800";
                    statusBox.innerText = "⚠️ วัตถุโคจรต่ำมาก (Low Altitude) มีแนวโน้มอยู่ในช่วง Terminal phase ใกล้ตกสู่ชั้นบรรยากาศ";
                } else {
                    statusBox.className = "p-3 rounded-lg text-sm font-medium bg-blue-950 text-blue-300 border border-blue-800";
                    statusBox.innerText = "ℹ️ วัตถุอยู่ในวงโคจรปกติ (ต้องสะสมข้อมูล TLE ข้ามช่วงเวลามาเทียบค่า Δa เพิ่มเติม)";
                }

                document.getElementById('resultBox').classList.remove('hidden');
            } catch (error) {
                alert("รูปแบบ TLE ไม่ถูกต้อง กรุณาตรวจสอบใหม่อีกครั้ง");
                console.error(error);
            }
        }
    </script>
</body>
</html>
